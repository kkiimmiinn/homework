<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과제 관리 웹앱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Noto Sans KR Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Touch friendly active state */
        .active-ring:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- App Container -->
    <div class="max-w-md w-full mx-auto min-h-screen flex flex-col bg-white shadow-xl relative pb-28">
        
        <!-- Header Section -->
        <header class="bg-gradient-to-r from-indigo-600 to-indigo-700 text-white p-5 sticky top-0 z-10 shadow-md">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center text-white">
                        <i class="fa-solid fa-graduation-cap text-lg"></i>
                    </div>
                    <h1 class="text-xl font-bold tracking-tight">과제 관리 웹앱</h1>
                </div>
                <button onclick="openModal()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1 active-ring">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>빠른 추가</span>
                </button>
            </div>

            <!-- Stats Bar -->
            <div class="grid grid-cols-3 gap-2 bg-white/10 backdrop-blur-sm rounded-xl p-2.5 text-center text-xs">
                <div class="border-r border-white/15">
                    <p class="text-indigo-200">전체 과제</p>
                    <p id="stat-total" class="text-base font-bold text-white mt-0.5">0</p>
                </div>
                <div class="border-r border-white/15">
                    <p class="text-indigo-200">진행 중</p>
                    <p id="stat-pending" class="text-base font-bold text-amber-300 mt-0.5">0</p>
                </div>
                <div>
                    <p class="text-indigo-200">마감 임박/초과</p>
                    <p id="stat-urgent" class="text-base font-bold text-rose-300 mt-0.5">0</p>
                </div>
            </div>
        </header>

        <!-- Controls & Filter Bar -->
        <div class="p-4 bg-slate-50 border-b border-slate-100 flex flex-col gap-3">
            <!-- Search Input -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" oninput="renderAssignments()" placeholder="과목명 또는 과제 검색..." 
                    class="w-full pl-9 pr-4 py-2 text-sm bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition shadow-sm">
            </div>

            <!-- Filter Tabs & Sort -->
            <div class="flex items-center justify-between text-xs font-medium">
                <div class="flex bg-slate-200/70 p-1 rounded-xl space-x-1" id="filter-tabs">
                    <button onclick="setFilter('all')" data-filter="all" class="filter-btn px-3 py-1 rounded-lg bg-white shadow-sm text-indigo-600 font-semibold transition">전체</button>
                    <button onclick="setFilter('active')" data-filter="active" class="filter-btn px-3 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition">진행중</button>
                    <button onclick="setFilter('completed')" data-filter="completed" class="filter-btn px-3 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition">완료</button>
                </div>

                <select id="sort-select" onchange="renderAssignments()" class="bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs text-slate-600 focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm cursor-pointer">
                    <option value="deadline">마감일순</option>
                    <option value="created">최근 등록순</option>
                    <option value="subject">과목명순</option>
                </select>
            </div>
        </div>

        <!-- Assignment List Section -->
        <main class="flex-1 p-4 overflow-y-auto">
            <div id="assignment-list" class="space-y-3">
                <!-- Items will be injected dynamically via JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center px-4">
                <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-400 mb-3 text-2xl">
                    <i class="fa-regular fa-clipboard"></i>
                </div>
                <h3 class="text-base font-semibold text-slate-700">등록된 과제가 없습니다</h3>
                <p class="text-xs text-slate-400 mt-1 max-w-xs">아래 '+' 버튼을 눌러 새로운 과제와 마감일을 등록해 보세요!</p>
            </div>
        </main>

        <!-- Bottom Floating Action Button (FAB) -->
        <div class="fixed bottom-6 left-0 right-0 max-w-md mx-auto px-6 pointer-events-none flex justify-center z-20">
            <button onclick="openModal()" class="pointer-events-auto bg-gradient-to-r from-indigo-600 to-indigo-700 text-white font-semibold py-3.5 px-6 rounded-full shadow-lg hover:shadow-indigo-500/30 active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 group">
                <i class="fa-solid fa-plus text-lg group-hover:rotate-90 transition-transform duration-300"></i>
                <span class="text-sm tracking-wide">새 과제 추가하기</span>
            </button>
        </div>

    </div>

    <!-- Add / Edit Assignment Modal -->
    <div id="assignment-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300 max-h-[90vh] overflow-y-auto">
            
            <!-- Modal Header -->
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
                <h2 id="modal-title" class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
                    <span>새 과제 추가</span>
                </h2>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:text-slate-600 hover:bg-slate-200 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- Modal Form -->
            <form id="assignment-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-id" value="">

                <!-- 과목명 Input -->
                <div>
                    <label for="subject-input" class="block text-xs font-semibold text-slate-600 mb-1">
                        과목명 <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="subject-input" required placeholder="예: 컴퓨터구조, 경영학개론"
                        class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition">
                </div>

                <!-- 과제 제목/내용 Input -->
                <div>
                    <label for="title-input" class="block text-xs font-semibold text-slate-600 mb-1">
                        과제 내용/제목 <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="title-input" required placeholder="예: 3장 연습문제 풀이 제출"
                        class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition">
                </div>

                <!-- 마감일 및 시간 Input -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="date-input" class="block text-xs font-semibold text-slate-600 mb-1">
                            마감 날짜 <span class="text-rose-500">*</span>
                        </label>
                        <input type="date" id="date-input" required
                            class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label for="time-input" class="block text-xs font-semibold text-slate-600 mb-1">
                            마감 시간
                        </label>
                        <input type="time" id="time-input" value="23:59"
                            class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition">
                    </div>
                </div>

                <!-- 메모/설명 Input -->
                <div>
                    <label for="memo-input" class="block text-xs font-semibold text-slate-600 mb-1">
                        메모 (선택)
                    </label>
                    <textarea id="memo-input" rows="2" placeholder="팀원 이름, 제출 링크 등 메모 작성..."
                        class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition resize-none"></textarea>
                </div>

                <!-- Form Buttons -->
                <div class="flex gap-2 pt-3">
                    <button type="button" onclick="closeModal()" class="w-1/3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold rounded-xl transition">
                        취소
                    </button>
                    <button type="submit" class="w-2/3 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-md transition active-ring">
                        저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Data State
        let assignments = [];
        let currentFilter = 'all';

        // Palette for subject badges (generated automatically)
        const badgeColors = [
            'bg-indigo-100 text-indigo-700 border-indigo-200',
            'bg-emerald-100 text-emerald-700 border-emerald-200',
            'bg-sky-100 text-sky-700 border-sky-200',
            'bg-purple-100 text-purple-700 border-purple-200',
            'bg-amber-100 text-amber-700 border-amber-200',
            'bg-rose-100 text-rose-700 border-rose-200',
            'bg-teal-100 text-teal-700 border-teal-200'
        ];

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            loadAssignments();
            setDefaultDate();
            renderAssignments();

            // Refresh D-Days every 30 seconds
            setInterval(renderAssignments, 30000);
        });

        // Load data from LocalStorage
        function loadAssignments() {
            const saved = localStorage.getItem('assignments_data');
            if (saved) {
                try {
                    assignments = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse local storage', e);
                    assignments = [];
                }
            } else {
                // Initial sample data if empty
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                
                const inThreeDays = new Date(today);
                inThreeDays.setDate(inThreeDays.getDate() + 3);

                assignments = [
                    {
                        id: '1',
                        subject: '컴퓨터구조',
                        title: '중간고사 대치 과제 제출',
                        dueDate: formatDateInput(tomorrow),
                        dueTime: '23:59',
                        memo: 'e-Class 업로드 필수 (PDF 형식)',
                        completed: false,
                        createdAt: Date.now() - 10000
                    },
                    {
                        id: '2',
                        subject: '경영학개론',
                        title: '팀 프로젝트 발표 자료 작성',
                        dueDate: formatDateInput(inThreeDays),
                        dueTime: '18:00',
                        memo: '3조 PPT 취합 후 확인',
                        completed: false,
                        createdAt: Date.now() - 5000
                    }
                ];
                saveAssignments();
            }
        }

        // Save data to LocalStorage
        function saveAssignments() {
            localStorage.setItem('assignments_data', JSON.stringify(assignments));
        }

        // Set default date input to today
        function setDefaultDate() {
            const today = new Date();
            document.getElementById('date-input').value = formatDateInput(today);
        }

        function formatDateInput(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // Calculate D-Day & detailed remaining time string
        function getDDayInfo(dueDateStr, dueTimeStr, isCompleted) {
            if (isCompleted) {
                return { text: '완료됨', badgeClass: 'bg-slate-100 text-slate-500 border-slate-200', status: 'completed' };
            }

            const now = new Date();
            const target = new Date(`${dueDateStr}T${dueTimeStr || '23:59'}:00`);
            const diffMs = target - now;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            if (diffMs < 0) {
                // Overdue
                const overDays = Math.abs(Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
                return {
                    text: overDays === 0 ? '시간 초과' : `D+${overDays} (기한 초과)`,
                    badgeClass: 'bg-rose-500 text-white border-rose-600 font-bold',
                    status: 'overdue'
                };
            } else if (diffHours < 24) {
                // Due Today / Under 24 hours
                if (diffHours < 1) {
                    const diffMins = Math.max(1, Math.floor(diffMs / (1000 * 60)));
                    return {
                        text: `마감 ${diffMins}분 전!`,
                        badgeClass: 'bg-rose-100 text-rose-700 border-rose-300 font-extrabold animate-pulse',
                        status: 'urgent'
                    };
                }
                return {
                    text: `D-DAY (${diffHours}시간 남음)`,
                    badgeClass: 'bg-amber-500 text-white border-amber-600 font-bold',
                    status: 'urgent'
                };
            } else if (diffDays <= 3) {
                // 1~3 days left
                return {
                    text: `D-${diffDays}`,
                    badgeClass: 'bg-amber-100 text-amber-800 border-amber-300 font-semibold',
                    status: 'warning'
                };
            } else {
                // More than 3 days left
                return {
                    text: `D-${diffDays}`,
                    badgeClass: 'bg-indigo-50 text-indigo-700 border-indigo-200 font-medium',
                    status: 'normal'
                };
            }
        }

        // Get consistent color badge for subjects
        function getSubjectBadgeClass(subject) {
            let hash = 0;
            for (let i = 0; i < subject.length; i++) {
                hash = subject.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % badgeColors.length;
            return badgeColors[index];
        }

        // Render Assignment List
        function renderAssignments() {
            const listEl = document.getElementById('assignment-list');
            const emptyEl = document.getElementById('empty-state');
            const searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
            const sortBy = document.getElementById('sort-select').value;

            // Filter logic
            let filtered = assignments.filter(item => {
                // Tab filter
                if (currentFilter === 'active' && item.completed) return false;
                if (currentFilter === 'completed' && !item.completed) return false;

                // Search query
                if (searchQuery) {
                    const matchSubject = item.subject.toLowerCase().includes(searchQuery);
                    const matchTitle = item.title.toLowerCase().includes(searchQuery);
                    return matchSubject || matchTitle;
                }
                return true;
            });

            // Sort logic
            filtered.sort((a, b) => {
                if (sortBy === 'deadline') {
                    const dateA = new Date(`${a.dueDate}T${a.dueTime || '23:59'}`);
                    const dateB = new Date(`${b.dueDate}T${b.dueTime || '23:59'}`);
                    return dateA - dateB;
                } else if (sortBy === 'created') {
                    return b.createdAt - a.createdAt;
                } else if (sortBy === 'subject') {
                    return a.subject.localeCompare(b.subject, 'ko');
                }
                return 0;
            });

            // Update Header Statistics
            updateStats();

            // Clear container
            listEl.innerHTML = '';

            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
                emptyEl.classList.add('flex');
            } else {
                emptyEl.classList.add('hidden');
                emptyEl.classList.remove('flex');

                filtered.forEach(item => {
                    const dday = getDDayInfo(item.dueDate, item.dueTime, item.completed);
                    const subjectStyle = getSubjectBadgeClass(item.subject);

                    const card = document.createElement('div');
                    card.className = `bg-white rounded-2xl p-4 border border-slate-100 shadow-sm hover:shadow-md transition-all duration-200 relative overflow-hidden ${item.completed ? 'opacity-65 bg-slate-50/80' : ''}`;

                    card.innerHTML = `
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex-1 min-w-0">
                                <!-- Top Badges -->
                                <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                                    <span class="inline-block text-xs font-semibold px-2.5 py-0.5 rounded-md border ${subjectStyle}">
                                        ${escapeHtml(item.subject)}
                                    </span>
                                    <span class="inline-block text-xs px-2.5 py-0.5 rounded-md border ${dday.badgeClass}">
                                        ${dday.text}
                                    </span>
                                </div>

                                <!-- Assignment Title -->
                                <h3 class="text-sm font-bold text-slate-800 ${item.completed ? 'line-through text-slate-400' : ''} truncate">
                                    ${escapeHtml(item.title)}
                                </h3>

                                <!-- Date & Time Display -->
                                <p class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                                    <i class="fa-regular fa-clock text-slate-400"></i>
                                    <span>${item.dueDate.replace(/-/g, '.')} ${item.dueTime || '23:59'} 마감</span>
                                </p>

                                <!-- Optional Memo -->
                                ${item.memo ? `
                                    <div class="mt-2 text-xs text-slate-500 bg-slate-50 p-2 rounded-lg border border-slate-100 flex items-start gap-1.5">
                                        <i class="fa-regular fa-note-sticky text-slate-400 mt-0.5"></i>
                                        <span class="whitespace-pre-line">${escapeHtml(item.memo)}</span>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Actions -->
                            <div class="flex items-center gap-1">
                                <!-- Checkbox / Complete Toggle -->
                                <button onclick="toggleComplete('${item.id}')" title="${item.completed ? '미완료로 표시' : '완료로 표시'}" 
                                    class="w-8 h-8 rounded-xl flex items-center justify-center transition ${item.completed ? 'bg-indigo-100 text-indigo-600' : 'bg-slate-100 hover:bg-slate-200 text-slate-400'}">
                                    <i class="fa-solid fa-check text-sm"></i>
                                </button>
                                
                                <!-- Edit Button -->
                                <button onclick="openEditModal('${item.id}')" title="수정" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>

                                <!-- Delete Button -->
                                <button onclick="deleteAssignment('${item.id}')" title="삭제" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-rose-100 text-slate-400 hover:text-rose-600 flex items-center justify-center transition">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;

                    listEl.appendChild(card);
                });
            }
        }

        // Update header counter badges
        function updateStats() {
            const total = assignments.length;
            const pending = assignments.filter(a => !a.completed).length;
            
            const urgentCount = assignments.filter(a => {
                if (a.completed) return false;
                const dday = getDDayInfo(a.dueDate, a.dueTime, a.completed);
                return dday.status === 'urgent' || dday.status === 'overdue';
            }).length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-urgent').innerText = urgentCount;
        }

        // Handle Filter Tab switching
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.className = 'filter-btn px-3 py-1 rounded-lg bg-white shadow-sm text-indigo-600 font-semibold transition';
                } else {
                    btn.className = 'filter-btn px-3 py-1 rounded-lg text-slate-600 hover:text-slate-900 transition';
                }
            });
            renderAssignments();
        }

        // Toggle Completed Status
        function toggleComplete(id) {
            assignments = assignments.map(item => {
                if (item.id === id) {
                    return { ...item, completed: !item.completed };
                }
                return item;
            });
            saveAssignments();
            renderAssignments();
        }

        // Delete Assignment
        function deleteAssignment(id) {
            assignments = assignments.filter(item => item.id !== id);
            saveAssignments();
            renderAssignments();
        }

        // Modal Controls
        function openModal() {
            document.getElementById('modal-title').innerHTML = `
                <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
                <span>새 과제 추가</span>
            `;
            document.getElementById('edit-id').value = '';
            document.getElementById('assignment-form').reset();
            setDefaultDate();
            document.getElementById('time-input').value = '23:59';

            const modal = document.getElementById('assignment-modal');
            const modalBox = modal.querySelector('div');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('translate-y-full');
            }, 10);
        }

        function openEditModal(id) {
            const item = assignments.find(a => a.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerHTML = `
                <i class="fa-solid fa-pen text-indigo-600"></i>
                <span>과제 정보 수정</span>
            `;
            document.getElementById('edit-id').value = item.id;
            document.getElementById('subject-input').value = item.subject;
            document.getElementById('title-input').value = item.title;
            document.getElementById('date-input').value = item.dueDate;
            document.getElementById('time-input').value = item.dueTime || '23:59';
            document.getElementById('memo-input').value = item.memo || '';

            const modal = document.getElementById('assignment-modal');
            const modalBox = modal.querySelector('div');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('translate-y-full');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('assignment-modal');
            const modalBox = modal.querySelector('div');

            modal.classList.add('opacity-0');
            modalBox.classList.add('translate-y-full');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Form Submit Handler
        function handleFormSubmit(e) {
            e.preventDefault();

            const editId = document.getElementById('edit-id').value;
            const subject = document.getElementById('subject-input').value.trim();
            const title = document.getElementById('title-input').value.trim();
            const dueDate = document.getElementById('date-input').value;
            const dueTime = document.getElementById('time-input').value || '23:59';
            const memo = document.getElementById('memo-input').value.trim();

            if (!subject || !title || !dueDate) {
                return;
            }

            if (editId) {
                // Update existing item
                assignments = assignments.map(item => {
                    if (item.id === editId) {
                        return { ...item, subject, title, dueDate, dueTime, memo };
                    }
                    return item;
                });
            } else {
                // Add new item
                const newItem = {
                    id: Date.now().toString(),
                    subject,
                    title,
                    dueDate,
                    dueTime,
                    memo,
                    completed: false,
                    createdAt: Date.now()
                };
                assignments.push(newItem);
            }

            saveAssignments();
            renderAssignments();
            closeModal();
        }

        // Utility: HTML Sanitizer
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
